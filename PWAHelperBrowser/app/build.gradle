plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pwahelperbrowser'
    compileSdk 30 // Target SDK, matches the platform version I installed

    defaultConfig {
        applicationId "com.example.pwahelperbrowser"
        minSdk 21 // Minimum SDK as per requirements
        targetSdk 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Specify Java toolchain for compatibility
    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1' // Common Android support library
    implementation 'com.google.android.material:material:1.4.0' // Material design components
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0' // Constraint layout
    testImplementation 'junit:junit:4.13.2' // JUnit for unit tests
    androidTestImplementation 'androidx.test.ext:junit:1.1.3' // JUnit for Android tests
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0' // Espresso for UI tests
}
